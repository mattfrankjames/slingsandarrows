[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ── The Postgres cutover, promoted ────────────────────────────────────────────
#
# USE_POSTGRES lived under [context.deploy-preview.environment] while previews
# were the only thing reading Postgres. It is here now, so every context —
# production included — reads from Postgres. Netlify Blobs still holds a full
# copy and is untouched by the migration; it stays the rollback.
#
# IMPORTANT: this variable does not reach the functions on its own. Netlify has
# two environment-variable systems and they do not overlap — what is declared
# here exists only while the build runs, and functions execute later in a
# process that sees only UI/API values. Set under deploy-preview, it sat here
# through every preview after the cutover landed and changed nothing:
# process.env.USE_POSTGRES was undefined at runtime and every preview served
# Blobs while reporting success.
#
# scripts/write-build-flags.mjs is what closes that gap. It runs first in
# `npm run build`, reads this variable while it still exists, and writes it into
# netlify/lib/build-flags.mjs, which the function bundler then ships. Deleting
# that step silently reverts every deploy to Blobs, so it is covered by
# tests/unit/build-flags.test.js and by GET /api/v1/health, which reports the
# backend a deploy is actually serving rather than the one it was configured for.
#
# ── Rolling back ─────────────────────────────────────────────────────────────
#
# Fastest: set USE_POSTGRES = "false" in the Netlify UI. UI values reach the
# runtime directly and beat the baked one, so it takes effect without a build.
# Then confirm at /api/v1/health, which should answer "blobs".
#
# Permanent: delete the line below and redeploy.
#
# Either way, writes made while Postgres was live exist only in Postgres —
# Blobs stopped receiving them at the cutover. Rolling back makes those writes
# invisible without destroying them; scripts/migrate-blobs-to-pg.mjs only ever
# copies Blobs → Postgres, so recovering the other direction is manual.
[build.environment]
  # Pinned, not inherited. @netlify/database declares `engines: node >= 22.12.0`,
  # and this site had no NODE_VERSION — so builds took whatever the build image
  # defaulted to, which was older, and the first deploy after adding that
  # dependency failed with a bare "Build script returned non-zero exit code: 4".
  #
  # The build succeeds locally and in a clean clone with npm ci, which is what
  # makes this worth writing down: nothing in the repository was wrong, and
  # reproducing it needed the one thing the repository did not specify. Pinning
  # also means the version stops moving under us when Netlify changes a default.
  NODE_VERSION = "22"

  # Every context reads Postgres. See the note above for how this reaches the
  # functions, and for how to roll it back.
  USE_POSTGRES = "true"

# ── Local development ─────────────────────────────────────────────────────────
#
# Pinned because the build is two stages and Netlify cannot guess which is the
# dev server: it detects both Eleventy and Parcel, then stops to ask. That
# prompt makes `netlify dev` unusable non-interactively, which matters more than
# it sounds — `netlify dev` is what runs the local PostgreSQL (a real Postgres
# 17 compiled to WebAssembly), and that is the only way to execute a migration
# on this machine. Without it the schema can be parsed and not run.
[dev]
  command = "npm run start"
  targetPort = 1234
  framework = "#custom"
  autoLaunch = false

# ── Clean URLs ────────────────────────────────────────────────────────────────

[[redirects]]
  from = "/feed"
  to = "/feed.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/studio"
  to = "/studio.html"
  status = 200

[[redirects]]
  from = "/bass-sequencer"
  to = "/studio"
  status = 301

[[redirects]]
  from = "/shows"
  to = "/shows.html"
  status = 200

[[redirects]]
  from = "/community"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200

[[redirects]]
  from = "/board"
  to = "/community"
  status = 301

[[redirects]]
  from = "/posts"
  to = "/feed"
  status = 301

# Status 200 rewrite — the browser's address bar (and window.location) stays
# on /post/<id>, it's never rewritten client-side, so post-view.js reads the
# id back out of the pathname rather than a query string.
[[redirects]]
  from = "/post/*"
  to = "/post.html"
  status = 200
  force = true

# RSS feeds are served directly by the rss-feed / rss-community functions,
# which register /feed.xml and /community.xml via their config.path. A 200
# rewrite here would NOT chain to a v2 function's in-code path, so it must
# not shadow those routes.

[[headers]]
  for = "/api/rss/*"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

# ── Cache headers ─────────────────────────────────────────────────────────────

# Hashed static assets (Parcel appends a content hash) — safe to cache forever
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files — short CDN cache, always revalidate so users get fresh pages
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# API responses — never cache at the CDN edge (service worker handles offline)
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Service worker — must never be cached so updates roll out immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

