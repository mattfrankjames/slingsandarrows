name: Browser tests

# Runs against the pull request's Netlify Deploy Preview rather than a local
# server, so the redirects, cache headers and functions in netlify.toml are
# actually exercised. A suite pointed at `parcel serve` would have no opinion
# about any of them.
#
# On waiting for the preview: this polls a URL derived from the PR number
# instead of reacting to a deployment event. Two reasons. Netlify announces
# previews on this repo with a *commit status*, not a GitHub Deployment — the
# deployments API returns nothing — so `on: deployment_status` never fires. And
# `status`/`deployment_status` workflows only run from the copy of the file on
# the default branch, so a change to one cannot be tested in the pull request
# that makes it. Polling has neither problem.
on:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_URL: https://deploy-preview-${{ github.event.number }}--slingsandarrows.netlify.app

jobs:
  browser:
    name: Smoke, routing, API contract, accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Netlify usually builds in well under two minutes; the ceiling is there
      # so a stuck deploy fails the job rather than burning the runner budget.
      - name: Wait for the Deploy Preview
        run: |
          echo "Waiting for $PREVIEW_URL"
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PREVIEW_URL" || echo 000)
            if [ "$status" = "200" ]; then
              echo "Preview ready after ~$((attempt * 10))s"
              exit 0
            fi
            echo "  attempt $attempt: HTTP $status"
            sleep 10
          done
          echo "::error::Deploy Preview never became reachable at $PREVIEW_URL"
          exit 1

      - name: Run browser tests
        env:
          BASE_URL: ${{ env.PREVIEW_URL }}
        run: npx playwright test --project=desktop

      # Baselines are per-platform: text rasterises differently on macOS and on
      # these runners. This job's set is the one that gates a merge.
      #
      # Deliberately no --update-snapshots: a suite that rewrites its own
      # expectations cannot fail. Playwright writes a *missing* baseline anyway
      # and still fails the test, and the artifact below carries the written
      # files out — so bootstrapping a new platform is one red run followed by
      # committing what it produced. Use update-baselines.yml for intentional
      # visual changes.
      - name: Visual baselines
        if: ${{ !cancelled() }}
        env:
          BASE_URL: ${{ env.PREVIEW_URL }}
        run: npx playwright test --project=desktop --project=mobile visual.spec.js visual-authed.spec.js

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            tests/browser/__screenshots__/
          retention-days: 7

  lighthouse:
    name: Performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the Deploy Preview
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PREVIEW_URL" || echo 000)
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Deploy Preview never became reachable at $PREVIEW_URL"
          exit 1

      - name: Audit the home and feed pages
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ env.PREVIEW_URL }}
            ${{ env.PREVIEW_URL }}/feed
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
