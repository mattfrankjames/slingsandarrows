name: Browser tests

# Runs against the Netlify Deploy Preview rather than a local server, so the
# redirects, cache headers and functions in netlify.toml are actually
# exercised. Netlify publishes a GitHub deployment when a preview is ready;
# this waits for that rather than guessing a URL or racing the build.
on:
  deployment_status:

jobs:
  browser:
    name: Smoke, routing, API contract, accessibility
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
        run: npx playwright test --project=desktop

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Performance budget
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit the feed and home pages
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.deployment_status.environment_url }}
            ${{ github.event.deployment_status.environment_url }}/feed
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
