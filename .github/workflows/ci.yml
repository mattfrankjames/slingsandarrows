name: CI

# Fast checks that need nothing deployed. These are the ones to require in
# branch protection — see docs/testing.md.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Catches a build that only breaks in production mode — a bad import
      # path, or a missing asset — before it reaches a deploy.
      - name: Production build
        run: npm run build

      # Cloudinary credentials were inlined into public bundles once already
      # (fixed in #87, reintroduced by #86, caught during #88's rebase). ESLint
      # guards the source; this guards the output.
      - name: No upload credentials in the built bundles
        run: |
          if grep -rl "upload_preset" dist --include="*.js" 2>/dev/null; then
            echo "::error::An unsigned upload_preset reached the built bundles."
            exit 1
          fi
          echo "No upload credentials in dist/"

      # NETLIFY_DATABASE_URL carries a password and grants the connecting role
      # everything, and migrations/0001 has no row level security underneath it
      # — deliberately, since Postgres cannot read Netlify Identity tokens. A
      # connection string in a bundle is therefore the whole database.
      #
      # A script rather than a grep because the Supabase key format this
      # started life guarding cannot be grepped for: the legacy one is a JWT
      # claiming service_role, and base64 encodes that claim three different
      # ways depending on its byte offset. The first attempt matched one of the
      # three and passed its own probe. See tests/unit/bundle-secrets.test.js.
      - name: No database credentials in the built bundles
        run: node scripts/check-bundle-secrets.mjs dist

      # A service worker can only control pages beneath its own URL. Moving the
      # source into a subdirectory once already pushed the build output to
      # /core/sw.js, where registering with { scope: '/' } throws — and offline
      # support, background sync and image caching fail silently. The
      # netlify.toml no-cache header for /sw.js depends on this path too.
      - name: Service worker is served from the site root
        run: |
          if [ ! -f dist/sw.js ]; then
            echo "::error::dist/sw.js is missing. A worker anywhere else cannot claim scope '/'."
            find dist -name 'sw*.js' -print
            exit 1
          fi
          grep -q '"/sw.js"' dist/feed.html \
            || { echo "::error::Pages do not resolve the worker to /sw.js."; exit 1; }
          echo "Service worker at dist/sw.js, referenced as /sw.js"
