name: Update visual baselines

# Regenerates the Linux baselines that CI compares against, and uploads them to
# download and commit. Run this when a change is *meant* to alter how a page
# looks — after reviewing the diffs, not instead of reviewing them.
#
# Baselines cannot be captured on a laptop for CI's benefit: text rasterises
# differently on macOS and on these runners, so a set produced locally fails
# here for reasons unrelated to the change under review. Hence a workflow.
#
#   gh workflow run update-baselines.yml -f preview_url=<a deploy preview URL>
#   gh run download <run-id> -n visual-baselines
#   cp -R visual-baselines/linux tests/browser/__screenshots__/
#
# Or, without downloading anything, name the pages whose captures should be
# kept and run it on the pull request's branch:
#
#   gh workflow run update-baselines.yml --ref <branch> \
#     -f preview_url=<a deploy preview URL> -f commit_pages="home shows"
#
# Those pages' captures (desktop and mobile) are committed to a new branch,
# baselines/<run id>, ready to cherry-pick onto the pull request. Not onto the
# pull request itself: a push made with the workflow's own token does not start
# CI, so the commit has to reach the pull request through an ordinary push.
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'URL to capture from (a Deploy Preview, or the live site)'
        required: true
        default: 'https://slingsandarrows.band'
      commit_pages:
        description: 'Optional: page names whose captures to commit to baselines/<run id>, e.g. "home shows"'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Without this the job races a deploy that is still building. It did:
      # every page failed with net::ERR_ABORTED, `|| true` swallowed it, and the
      # artifact shipped the repository's own checked-out baselines — stale
      # files that looked exactly like a successful capture.
      - name: Wait for the target to answer
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$TARGET" || echo 000)
            if [ "$status" = "200" ]; then echo "Ready after ~$((attempt * 10))s"; exit 0; fi
            echo "  attempt $attempt: HTTP $status"
            sleep 10
          done
          echo "::error::$TARGET never became reachable"
          exit 1
        env:
          TARGET: ${{ inputs.preview_url }}

      # No `|| true`. --update-snapshots passes when it writes a snapshot, so
      # anything that fails here is a real problem and should be visible.
      #
      # `=all`, not the bare flag. The default mode is `changed`, which rewrites
      # only a baseline whose comparison already failed — so a change smaller
      # than maxDiffPixelRatio updates nothing, and the job reports success
      # having written the same files back. That is how the dialogs kept their
      # black-on-black text through a baseline refresh. `all` rewrites every
      # capture, which is what a workflow named "update baselines" should do.
      - name: Capture
        env:
          BASE_URL: ${{ inputs.preview_url }}
        run: |
          npx playwright test --project=desktop --project=mobile \
            visual.spec.js visual-authed.spec.js --update-snapshots=all

      # Uploaded even on failure, so a partial capture can still be inspected —
      # but the job goes red, which is the part that was missing.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-baselines
          path: tests/browser/__screenshots__/
          retention-days: 14

      # Only the named pages. --update-snapshots=all rewrites every capture,
      # including byte-level PNG noise on pages nothing changed, and that noise
      # should not ride along into a commit.
      - name: Commit the named pages
        if: ${{ success() && inputs.commit_pages != '' }}
        env:
          PAGES: ${{ inputs.commit_pages }}
          PREVIEW: ${{ inputs.preview_url }}
          TARGET_BRANCH: baselines/${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          for page in $PAGES; do
            case "$page" in
              *[!a-z0-9-]*) echo "::error::Not a page name: $page"; exit 1 ;;
            esac
            git add -- "tests/browser/__screenshots__/linux/*/$page.png"
          done
          if git diff --cached --quiet; then
            echo "::notice::The captures for $PAGES match the committed baselines; nothing to commit."
            exit 0
          fi
          git commit -m "test: refresh the $PAGES baselines" -m "Captured from $PREVIEW by update-baselines run $GITHUB_RUN_ID."
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "::notice::Committed to $TARGET_BRANCH: $(git rev-parse HEAD)"
