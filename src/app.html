  <style>
    .composer {
      width: 95%;
      max-width: 960px;
      margin: 0 auto;
    }
    .composer label {
      display: block;
      margin-block-end: 0.25em;
      font-size: 0.9em;
      opacity: 0.7;
    }
    .composer input,
    .composer textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      font-family: "ballinger-mono", sans-serif;
      font-size: 1rem;
      padding: 0.75em;
      border-radius: 4px;
      margin-block-end: 1.25em;
      resize: vertical;
    }
    .composer input::placeholder,
    .composer textarea::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }
    .composer input:focus,
    .composer textarea:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.6);
    }
    .composer textarea {
      min-height: 200px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: white;
      font-family: "ballinger-mono", sans-serif;
      font-size: 1rem;
      padding: 0.6em 1.5em;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s;
      letter-spacing: -0.05ch;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-sm {
      font-size: 0.85em;
      padding: 0.4em 1em;
    }
    .composer input[type="file"] {
      background: transparent;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      cursor: pointer;
      padding: 0.5em;
    }
    .composer input[type="file"]::-webkit-file-upload-button {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: white;
      font-family: "ballinger-mono", sans-serif;
      padding: 0.3em 0.8em;
      cursor: pointer;
      border-radius: 4px;
      margin-inline-end: 0.75em;
    }
    #image-preview-wrap {
      display: flex;
      align-items: flex-start;
      gap: 0.75em;
      margin-block-start: -0.5em;
      margin-block-end: 1.25em;
    }
    #preview-media {
      flex: 1;
      min-width: 0;
    }
    #preview-media img,
    #preview-media video {
      max-width: 100%;
      max-height: 200px;
      border-radius: 4px;
      display: block;
    }
    #preview-media audio {
      width: 100%;
      display: block;
    }
    #remove-image-btn {
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.7);
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 50%;
      width: 1.6em;
      height: 1.6em;
      font-size: 0.85em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .composer-toolbar {
      margin-block-end: 0.5em;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5em;
    }
    .composer-hint {
      font-size: 0.8em;
      opacity: 0.55;
      margin-block-end: 0.75em;
    }
    .link-insert-panel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 0.75em 1em;
      margin-block-end: 1em;
    }
    .link-insert-panel label {
      margin-block-end: 0.25em;
    }
    .link-insert-panel input {
      margin-block-end: 0.75em;
    }
    .link-insert-actions {
      display: flex;
      gap: 0.5em;
    }
    .link-insert-status {
      font-size: 0.85em;
      min-height: 1.2em;
      margin-block-start: 0.5em;
      margin-block-end: 0;
    }
    .link-insert-status.error { color: #f5a8a8; }
    #upload-status {
      font-size: 0.85em;
      min-height: 1.2em;
      margin-block-start: -1em;
      margin-block-end: 1em;
    }
    #upload-status.uploading { opacity: 0.6; }
    #upload-status.error { color: #f5a8a8; }
    #status-msg {
      margin-block-start: 1em;
      min-height: 1.5em;
      font-size: 0.9em;
    }
    #status-msg.success { color: #a8f5a8; }
    #status-msg.error   { color: #f5a8a8; }
    #auth-gate {
      text-align: center;
      padding: 3em 1em;
    }
    #auth-gate p {
      margin-block-end: 1em;
      opacity: 0.7;
    }
    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-block-end: 1.5em;
      padding-block-end: 0.75em;
      border-block-end: 1px solid rgba(255, 255, 255, 0.2);
    }
    .user-email {
      font-size: 0.85em;
      opacity: 0.6;
    }
    [hidden] { display: none !important; }
    .auth-bar {
      display: flex;
      align-items: center;
      gap: 0.75em;
      margin-block-end: 1.25em;
      padding-block-end: 0.75em;
      border-block-end: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.85em;
    }
    .auth-bar-email {
      opacity: 0.6;
    }

<body>
  <div class="wrapper min-h-screen">
    <header class="p-4 text-white">
      <h1 class="glitch">
        <a href="/">
          <span aria-hidden="true">Slings & Arrows</span>
          Slings & Arrows
          <span aria-hidden="true">Slings & Arrows</span>
        </a>
      </h1>
      <nav class="site-nav" aria-label="Site navigation">
        <a href="./feed.html">Feed</a>

        <a href="./gallery.html">Gallery</a>
        <a href="./shows.html">Shows</a>
        <a href="./studio.html">Studio</a>
      </nav>
    </header>
    <main class="p-4" id="main-content">
      <div class="composer">

        <div id="auth-bar" hidden class="auth-bar">
          <span id="auth-bar-email" class="auth-bar-email"></span>
          <button class="btn btn-sm" id="auth-bar-logout">Sign Out</button>
        </div>

        <div id="auth-gate">
          <p>Sign in to publish posts</p>
          <button class="btn" id="login-btn">Sign In</button>
        </div>

        <div id="composer-panel" hidden>
          <div class="user-bar">
            <span class="user-email" id="user-email"></span>
            <button class="btn btn-sm" id="logout-btn">Sign Out</button>
          </div>
          <h2>New Post</h2>
          <form id="post-form">
            <label for="post-title">Title (optional)</label>
            <input type="text" id="post-title" name="title" placeholder="Leave blank to post without a title">
            <label for="post-body">Body *</label>
            <div class="composer-toolbar">
              <button type="button" class="btn btn-sm" id="insert-link-btn">🔗 Insert Link</button>
              <button type="button" class="btn btn-sm" id="insert-readmore-btn">✂ Insert Read More Break</button>
            </div>
            <p class="composer-hint">Everything above the break shows in the feed; readers click "Read more" to see the rest.</p>
            <div id="link-insert-panel" hidden class="link-insert-panel">
              <label for="link-text-input">Link text</label>
              <input type="text" id="link-text-input" placeholder="e.g. Get tickets">
              <label for="link-url-input">URL</label>
              <input type="url" id="link-url-input" placeholder="https://…">
              <div class="link-insert-actions">
                <button type="button" class="btn btn-sm" id="link-insert-confirm">Insert</button>
                <button type="button" class="btn btn-sm" id="link-insert-cancel">Cancel</button>
              </div>
              <p id="link-insert-status" class="link-insert-status"></p>
            </div>
            <textarea id="post-body" name="body" placeholder="What's happening with the band?" required></textarea>
            <label for="post-image">Photo / Video / Audio (optional)</label>
            <input type="file" id="post-image" name="image" accept="image/*,video/*,audio/*">
            <div id="image-preview-wrap" hidden>
              <div id="preview-media"></div>
              <button type="button" id="remove-image-btn" aria-label="Remove media">✕</button>
            </div>
            <p id="upload-status" aria-live="polite"></p>
            <button type="submit" class="btn" id="submit-btn">Publish Post</button>
            <p id="status-msg" role="status" aria-live="polite"></p>
          </form>
        </div>

      </div>
    </main>
    <footer class="p-4 text-white text-center">
